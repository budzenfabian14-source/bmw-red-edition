
name: Build BMW E46

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Extract app
        run: |
          unzip -q BMW_RED_EDITION_2.3.1_3D_FIX_SOURCE.zip -d extracted        
          test -f extracted/BMW_RED_EDITION_APP/package.json
          cd extracted/BMW_RED_EDITION_APP
          npm install
          npx cap add android
          npx cap sync android

      - name: Build APK
        working-directory: extracted/BMW_RED_EDITION_APP/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BMW-RED-EDITION-2.3-APK
          path: extracted/BMW_RED_EDITION_APP/android/app/build/outputs/apk/debug/app-debug.apk
          
